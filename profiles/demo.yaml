# Demo profile — points at BatchPilot's own built-in mock API, which simulates
# an endpoint with PARTIAL ACCEPTANCE (some rows accepted, some rejected).
# Perfect for trying the tool with zero setup.
name: Demo (built-in mock API)
description: Sends to BatchPilot's own /mock/ingest endpoint. No credentials needed.
endpoint: ${BATCHPILOT_BASE_URL}/mock/ingest
method: POST
records_key: records
batch_size: 25

fields:
  - name: name
    required: true
  - name: email
    required: true
    type: email
    unique: true
  - name: phone
    type: phone
  - name: quantity
    type: integer
    min: 0
  - name: price
    type: number
    min: 0

response_map:
  results_path: results
  status_field: status
  success_values: [accepted]
  message_field: message
  index_field: index
