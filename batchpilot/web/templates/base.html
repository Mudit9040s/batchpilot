<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BatchPilot{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="flex items-center gap-2 font-bold text-lg tracking-tight">
        <span class="inline-flex h-7 w-7 items-center justify-center rounded-lg bg-gradient-to-br from-sky-400 to-indigo-600 text-white text-sm">⇪</span>
        BatchPilot
      </a>
      <a href="/" class="text-sm text-slate-300 hover:text-white">New upload</a>
      <a href="/history" class="text-sm text-slate-300 hover:text-white">History</a>
      <a href="/guide" class="text-sm text-slate-300 hover:text-white">📖 Guide</a>
      <a href="/logout" class="ml-auto text-xs text-slate-400 hover:text-white">Sign out</a>
    </div>
  </nav>
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
