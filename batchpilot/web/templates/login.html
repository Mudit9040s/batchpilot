<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · BatchPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-sky-400 to-indigo-600 text-white text-xl">⇪</span>
      <h1 class="mt-3 text-2xl font-bold">BatchPilot</h1>
      <p class="text-sm text-slate-400">Sign in to continue</p>
    </div>

    {% if error %}
    <div class="mb-4 rounded-lg border border-red-500/40 bg-red-500/10 px-4 py-3 text-red-300 text-sm">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4 rounded-2xl border border-slate-800 bg-slate-900/50 p-6">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label class="block text-sm font-medium mb-1">Username</label>
        <input type="text" name="username" required autofocus autocomplete="username"
               class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm">
      </div>
      <button class="w-full rounded-lg bg-gradient-to-r from-sky-500 to-indigo-600 px-4 py-2.5 font-semibold text-white hover:opacity-90">
        Sign in →
      </button>
      {% if default_creds %}
      <p class="text-xs text-amber-300/90 text-center">Default login: <code>admin</code> / <code>batchpilot</code> — set
      BATCHPILOT_USERNAME &amp; BATCHPILOT_PASSWORD env vars to change it.</p>
      {% endif %}
    </form>
  </div>
</body>
</html>
