name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v
      - name: Smoke-boot the web app
        run: |
          uvicorn batchpilot.web.app:app --port 8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/health
          # The root page is now the public presentation landing page (200), never 500.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)
          echo "GET / -> $code"
          test "$code" = "200"
          # And the login page itself must still render on its own.
          curl -sf http://127.0.0.1:8000/login > /dev/null
