name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v
      - name: Smoke-boot the web app
        run: |
          uvicorn batchpilot.web.app:app --port 8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/health
